[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "pele-python"
dynamic = ["version"]
description = "Render Mermaid diagrams to SVG with vendored Pele and embedded QuickJS"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "src/pele_python/_vendor/LICENSE"]
authors = [{name = "Çağtay Fabry", email = "cagtay.fabry@bam.de"}]
keywords = ["mermaid", "svg", "pele", "diagrams", "jupyter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = ["quickjs-ng==0.17.0.2"]

[project.urls]
Homepage = "https://github.com/CagtayFabry/pele-python"
Repository = "https://github.com/CagtayFabry/pele-python"
Issues = "https://github.com/CagtayFabry/pele-python/issues"
Changelog = "https://github.com/CagtayFabry/pele-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/pele_python"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/examples",
  "/README.md", "/LICENSE", "/pyproject.toml", "/pixi.toml", "/pixi.lock",
  "/CONTRIBUTING.md", "/SECURITY.md", "/CHANGELOG.md",
  "/pele-python-wrapper-spec.md", "/.github",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".pixi", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
